name: Publish TVGL to NuGet.org

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - TVGL
          - TVGL.PolygonImportExport

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-tvgl-to-nuget
  cancel-in-progress: false

jobs:
  publish:
    name: Pack, test, and publish
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    environment: nuget-release

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Read package identity
        id: package
        shell: pwsh
        run: |
          $selection = '${{ inputs.package }}'
          switch ($selection) {
              'TVGL' {
                  $project = 'TessellationAndVoxelizationGeometryLibrary/TessellationAndVoxelizationGeometryLibrary.csproj'
                  $smokeScript = './PackageSmokeTest/Run-PackageSmokeTest.ps1'
              }
              'TVGL.PolygonImportExport' {
                  $project = 'PolygonImportExport/PolygonImportExport.csproj'
                  $smokeScript = './PolygonImportExport.PackageSmokeTest/Run-PackageSmokeTest.ps1'
              }
              default {
                  throw "Unknown package selection '$selection'."
              }
          }

          $packageId = (dotnet msbuild $project -getProperty:PackageId).Trim()
          if ($LASTEXITCODE -ne 0) {
              throw 'Unable to read the project PackageId property.'
          }

          $version = (dotnet msbuild $project -getProperty:Version).Trim()
          if ($LASTEXITCODE -ne 0) {
              throw 'Unable to read the project Version property.'
          }

          if ($packageId -ne $selection) {
              throw "Expected package ID '$selection', but found '$packageId'."
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
              throw 'The project Version property is empty.'
          }

          "id=$packageId" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "project=$project" >> $env:GITHUB_OUTPUT
          "smoke-script=$smokeScript" >> $env:GITHUB_OUTPUT
          "artifact-directory=artifacts/nuget/$packageId/$version" >> $env:GITHUB_OUTPUT

      - name: Pack release artifacts
        shell: pwsh
        run: |
          dotnet pack `
            '${{ steps.package.outputs.project }}' `
            --configuration Release `
            --output '${{ steps.package.outputs.artifact-directory }}' `
            -p:ContinuousIntegrationBuild=true

      - name: Verify package files
        shell: pwsh
        run: |
          $artifactDirectory = '${{ steps.package.outputs.artifact-directory }}'
          $packageBaseName = '${{ steps.package.outputs.id }}.${{ steps.package.outputs.version }}'
          $packagePath = Join-Path $artifactDirectory "$packageBaseName.nupkg"
          $symbolsPath = Join-Path $artifactDirectory "$packageBaseName.snupkg"

          if (-not (Test-Path -LiteralPath $packagePath -PathType Leaf)) {
              throw "Package not found: $packagePath"
          }
          if (-not (Test-Path -LiteralPath $symbolsPath -PathType Leaf)) {
              throw "Symbol package not found: $symbolsPath"
          }

      - name: Smoke test packed package
        shell: pwsh
        run: |
          & '${{ steps.package.outputs.smoke-script }}' `
            -PackageVersion '${{ steps.package.outputs.version }}' `
            -ArtifactDirectory '${{ steps.package.outputs.artifact-directory }}'

      - name: Authenticate to NuGet.org
        id: login
        uses: NuGet/login@v1
        with:
          user: MattCampbell

      - name: Publish package and symbols
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $packagePath = Join-Path `
            '${{ steps.package.outputs.artifact-directory }}' `
            '${{ steps.package.outputs.id }}.${{ steps.package.outputs.version }}.nupkg'

          dotnet nuget push $packagePath `
            --api-key $env:NUGET_API_KEY `
            --source https://api.nuget.org/v3/index.json
